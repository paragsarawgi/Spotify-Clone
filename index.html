<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="roots.css">
    <link rel="icon" type="image/svg+xml" href="spotify-icon.svg?v=2"> 
    <!-- "Why did you put a ?v=2 at the end of that image path?
    "The browser was refusing to fetch the updated logo because it had the old filename locked in its cache. By appending a dummy query parameter, I changed the string just enough to trick the browser into thinking it was asking for a brand new file, forcing a network request." -->
    <title>Spotify - Listen to Music anytime, anywhere</title>
</head>
<body>
    <!-- navbar -->
    <nav>
        <div class="nav-left">
            <div id="logo"><i class="fa-brands fa-spotify"></i></div>
            <div id="home">
                <div id="home-container">
                    <i class="fa-regular fa-house"></i>
                </div>
            </div>
            <label id="search" for="search-input">
                <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
                <input type="text" placeholder="What do you wanna play?" id="search-input">
            </label>
        </div>
        <div class="nav-right">
            <div id="premium"><a href="#">Premium</a></div>
            <div id="support"><a href="#">Support</a></div>
            <div id="download"><a href="#">Download</a></div>
            <div id="login"><a href="#">Log In</a></div>
        </div>
    </nav>
    <!-- main section -->
    <main>
        <!-- left box -->
        <div class="left-box">
            <header">
                <h3>
                    Your Library
                </h3>
                <button id="create">
                    <i class="fa-solid fa-plus"></i>
                     <i class="fa-solid fa-x"></i>
                    Create Playlist
                </button>
            </header>
            <div class="boxes">
                <div class="box">
                    <h4>Create your first playlist</h4>
                    <p>It's easy we'll help you out</p>
                    <button id="create-playlist">Create Playlist</button>
                </div>
                <div class="box">
                    <h4>Let's find some podcasts</h4>
                    <p>We'll keep you updated on the latest episodes</p>
                    <button id="browse-podcasts">Browse Podcasts</button>
                </div>
            </div>
            <div class="footer">
                <div class="links">
                    <a href="#">Legal</a>
                    <a href="#">Privacy</a>
                    <a href="#">Cookies</a>
                    <a href="#">Contact</a>
                </div>
                <div class="language">
                    <button id="language">
                        <i class="fa-solid fa-globe text-base"></i>
                        <span>English</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="right-box">
            right
        </div>
    </main>
</body>
</html>
